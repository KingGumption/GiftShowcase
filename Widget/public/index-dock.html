    <title>King Gumption Studio — Stream Output</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      #dock-stage { position: absolute; left: 0; top: 0; overflow: hidden; background: transparent; transform-origin: 0 0; }
      .dock-renderer { position: absolute; border: 0; background: transparent; opacity: 1; transition: opacity 160ms ease; }
      .dock-renderer.is-loading { opacity: 0; pointer-events: none; }
      .dock-status { position: fixed; left: 10px; bottom: 10px; z-index: 20; max-width: calc(100% - 20px); padding: 6px 9px; border-radius: 7px; background: rgba(9, 11, 18, .82); color: #fff; font: 700 11px/1.3 Arial, sans-serif; }
      .dock-status.is-connected { opacity: 0; pointer-events: none; }
    </style>
  </head>

    <div id="dock-status" class="dock-status">Loading dock…</div>
